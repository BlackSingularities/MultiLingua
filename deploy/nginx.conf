# Dołączane do istniejącego bloku HTTPS redzikowski.com (proxy_nginx).
location = /multilingua {
    return 308 /multilingua/;
}

location ^~ /multilingua/ {
    resolver 127.0.0.11 valid=10s;
    set $multilingua_upstream http://multilingua:8000;
    rewrite ^/multilingua/(.*)$ /$1 break;
    proxy_pass $multilingua_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /multilingua;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
