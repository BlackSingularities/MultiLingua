extras:
  collocations:
    gdzie (przyimki):
      - [abitare a + miasto, mieszkać w (mieście), "Abito a Cracovia.", "Mieszkam w Krakowie."]
      - [abitare in + kraj / ulica, mieszkać w (kraju) / na (ulicy), "Abito in via Garibaldi 5.", "Mieszkam na ulicy Garibaldiego 5."]
      - [abitare da + osoba, mieszkać u (kogoś), "Abito dai miei per ora.", "Na razie mieszkam u rodziców."]
    jak:
      - [abitare da solo, mieszkać samemu, "Abiti da solo o con amici?", "Mieszkasz sam czy z przyjaciółmi?"]
      - [abitare in affitto, mieszkać w wynajętym, "Abitiamo in affitto.", "Wynajmujemy mieszkanie."]
  idioms:
    - [abitare a due passi, mieszkać o krok stąd, "Abito a due passi dalla stazione.", "Mieszkam dwa kroki od dworca."]
    - [abitare in capo al mondo, mieszkać na końcu świata, "Abitano in capo al mondo!", "Mieszkają na końcu świata!"]
  phrases:
    - [dove abiti?, gdzie mieszkasz?, "Dove abiti? — In centro.", "Gdzie mieszkasz? — W centrum."]
    - [abito qui vicino, mieszkam niedaleko, "Abito qui vicino, vieni a trovarmi.", "Mieszkam niedaleko, wpadnij."]
  related:
    - [l'abitazione, mieszkanie; lokal, "Un'abitazione di 80 metri quadri.", "Mieszkanie o powierzchni 80 metrów kwadratowych."]
    - [l'abitante, mieszkaniec, "Il paese ha mille abitanti.", "Miejscowość ma tysiąc mieszkańców."]
  synonyms:
    - {t: vivere, n: żyć; mieszkać, note: "Vivere a Roma = abitare a Roma, ale vivere znaczy też „żyć”. W czasach złożonych zwykle z essere (sono vissuto).", ex: ["Vivo a Roma da due anni.", "Mieszkam w Rzymie od dwóch lat."]}
    - {t: stare, n: przebywać; mieszkać (potocznie), note: "Potocznie: sto a Milano — mieszkam/jestem w Mediolanie.", ex: ["Dove stai adesso?", "Gdzie teraz mieszkasz?"]}
