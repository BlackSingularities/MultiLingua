      - [non abiti, niech Pan/Pani nie mieszka, "Non abiti in quella zona, è rumorosa.", "Proszę nie mieszkać w tej okolicy, jest głośna."]
      - [non abitiamo, nie mieszkajmy, "Non abitiamo più in affitto!", "Nie mieszkajmy już w wynajętym!"]
      - [non abitate, nie mieszkajcie, "Non abitate vicino all'autostrada.", "Nie mieszkajcie blisko autostrady."]
      - [non abitino, niech nie mieszkają, "Non abitino da soli, sono anziani.", "Niech nie mieszkają sami, są starsi."]
