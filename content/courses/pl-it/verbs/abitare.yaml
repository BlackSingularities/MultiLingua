      - [abiti, niech Pan/Pani mieszka, "Abiti pure qui finché vuole.", "Proszę tu mieszkać, jak długo pan chce."]
      - [abitiamo, mieszkajmy, "Abitiamo vicino ai nonni!", "Zamieszkajmy blisko dziadków!"]
      - [abitate, mieszkajcie, "Abitate in centro, è più comodo.", "Mieszkajcie w centrum, tak wygodniej."]
      - [abitino, niech mieszkają, "Abitino pure dove vogliono.", "Niech mieszkają, gdzie chcą."]
    negativo:
