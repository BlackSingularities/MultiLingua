      - [avreste abitato, mieszkalibyście (wtedy), "Avreste abitato meglio al sud.", "Lepiej by wam się mieszkało na południu."]
      - [avrebbero abitato, mieszkaliby (wtedy), "Avrebbero abitato in Italia.", "Mieszkaliby we Włoszech."]
