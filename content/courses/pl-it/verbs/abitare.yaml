      - [abiteremmo, mieszkalibyśmy, "Abiteremmo in una casa più piccola.", "Mieszkalibyśmy w mniejszym domu."]
      - [abitereste, mieszkalibyście, "Abitereste in un grattacielo?", "Zamieszkalibyście w wieżowcu?"]
      - [abiterebbero, mieszkaliby, "Abiterebbero al mare, se potessero.", "Mieszkaliby nad morzem, gdyby mogli."]
    passato:
