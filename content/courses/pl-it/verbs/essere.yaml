      - [è stato/stata, był/była, "È stata una bella giornata.", "To był piękny dzień."]
      - [siamo stati/state, byliśmy/byłyśmy, "Siamo stati fortunati con il tempo.", "Mieliśmy szczęście z pogodą."]
      - [siete stati/state, byliście/byłyście, "Siete stati gentilissimi, grazie!", "Byliście bardzo uprzejmi, dziękuję!"]
      - [sono stati/state, byli/były, "I bambini sono stati bravi oggi.", "Dzieci były dziś grzeczne."]
    trapassato_prossimo:
      - [ero stato/stata, byłem/byłam (wcześniej), "Non ero mai stato in un posto così bello.", "Nigdy wcześniej nie byłem w tak pięknym miejscu."]
      - [eri stato/stata, byłeś/byłaś (wcześniej), "Mi hai detto che eri già stato lì.", "Powiedziałeś mi, że już tam byłeś."]
      - [era stato/stata, był/była (wcześniej), "Il film era stato un successo, quindi hanno fatto il seguito.", "Film odniósł sukces, więc nakręcono kontynuację."]
      - [eravamo stati/state, byliśmy/byłyśmy (wcześniej), "Eravamo stati amici per anni.", "Byliśmy przyjaciółmi przez lata."]
      - [eravate stati/state, byliście/byłyście (wcześniej), "Eravate stati avvisati del ritardo?", "Czy uprzedzono was o opóźnieniu?"]
      - [erano stati/state, byli/były (wcześniej), "Erano già stati in vacanza a luglio, così ad agosto lavoravano.", "Byli już na wakacjach w lipcu, więc w sierpniu pracowali."]
    passato_remoto:
      - [fui, byłem/byłam, "Nel 1990 fui assunto in banca.", "W 1990 roku zostałem zatrudniony w banku."]
      - [fosti, byłeś/byłaś, "Fosti tu a dirmelo per primo.", "To ty pierwszy mi o tym powiedziałeś."]
      - [fu, był/była, "Dante fu un grande poeta.", "Dante był wielkim poetą."]
      - [fummo, byliśmy/byłyśmy, "Fummo felici di rivederli.", "Byliśmy szczęśliwi, że ich znów widzimy."]
