      - [fu stato/stata, był/była (wcześniej), "Quando fu stato chiaro, tutti tacquero.", "Gdy wszystko stało się jasne, wszyscy umilkli."]
      - [fummo stati/state, byliśmy/byłyśmy (wcześniej), "Dopo che fummo stati in chiesa, pranzammo.", "Po tym, jak byliśmy w kościele, zjedliśmy obiad."]
      - [foste stati/state, byliście/byłyście (wcześniej), "Appena foste stati liberi, vi chiamai.", "Gdy tylko byliście wolni, zadzwoniłem do was."]
