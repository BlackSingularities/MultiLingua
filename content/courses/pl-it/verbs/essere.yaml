      - [sarai stato/stata, będziesz już (był/była), "Sarai stato stanco dopo un viaggio così.", "Pewnie byłeś zmęczony po takiej podróży."]
      - [sarà stato/stata, pewnie był/była, "Sarà stato il vento.", "To pewnie był wiatr."]
      - [saremo stati/state, będziemy już (byli/były), "A giugno saremo stati sposati dieci anni.", "W czerwcu minie dziesięć lat naszego małżeństwa."]
      - [sarete stati/state, pewnie byliście/byłyście, "Sarete stati contenti del risultato.", "Pewnie byliście zadowoleni z wyniku."]
      - [saranno stati/state, pewnie byli/były, "Saranno stati i vicini a fare rumore.", "To pewnie sąsiedzi hałasowali."]
