      - [eravamo, byliśmy/byłyśmy, "Eravamo stanchi dopo il viaggio.", "Byliśmy zmęczeni po podróży."]
      - [eravate, byliście/byłyście, "Eravate a casa quando ho chiamato?", "Byliście w domu, kiedy dzwoniłem?"]
      - [erano, byli/były, "Le strade erano piene di gente.", "Ulice były pełne ludzi."]
    passato_prossimo:
      - [sono stato/stata, byłem/byłam, "Sono stato a Roma due volte.", "Byłem w Rzymie dwa razy."]
