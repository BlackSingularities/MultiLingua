verb: essere
n: być
emoji: "🙋"
category: podstawowe
regular: false
group: II koniugacja (-ere), całkowicie nieregularny
auxiliary: essere
transitive: nieprzechodni
ipa: /ˈɛs.se.re/
stress: ES-se-re (pierwsza sylaba)
note: >-
  Najważniejszy czasownik języka: opisuje, kim i jaki ktoś jest, skąd pochodzi i gdzie się znajduje.
  Jest też czasownikiem posiłkowym — z nim tworzą czasy złożone czasowniki ruchu, zmiany stanu
  i wszystkie zwrotne (sono andato, mi sono alzato).

forms:
  indicativo:
    presente:
      - [sono, jestem, "Sono polacco, di Cracovia.", "Jestem Polakiem, z Krakowa."]
      - [sei, jesteś, "Sei pronto per partire?", "Jesteś gotowy do wyjazdu?"]
      - [è, jest, "Marta è molto simpatica.", "Marta jest bardzo sympatyczna."]
      - [siamo, jesteśmy, "Siamo in ritardo, sbrigati!", "Jesteśmy spóźnieni, pospiesz się!"]
      - [siete, jesteście, "Siete fratelli?", "Jesteście rodzeństwem?"]
      - [sono, są, "I negozi sono chiusi la domenica.", "Sklepy są zamknięte w niedzielę."]
    imperfetto:
      - [ero, byłem/byłam, "Da bambino ero molto timido.", "Jako dziecko byłem bardzo nieśmiały."]
