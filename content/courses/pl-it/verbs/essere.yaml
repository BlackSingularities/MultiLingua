extras:
  collocations:
    z przymiotnikami:
      - [essere stanco, być zmęczonym, "Oggi sono molto stanco.", "Jestem dziś bardzo zmęczony."]
      - [essere contento, być zadowolonym, "Sei contento del nuovo lavoro?", "Jesteś zadowolony z nowej pracy?"]
      - [essere in ritardo, być spóźnionym, "Scusa, sono in ritardo!", "Przepraszam, spóźniłem się!"]
    z przyimkami:
      - [essere di, pochodzić z; być czyimś, "Di dove sei? — Sono di Varsavia.", "Skąd jesteś? — Jestem z Warszawy."]
      - [essere a casa, być w domu, "Stasera sono a casa.", "Dziś wieczorem jestem w domu."]
      - [essere d'accordo, zgadzać się, "Sono d'accordo con te.", "Zgadzam się z tobą."]
  idioms:
    - [essere al verde, być spłukanym, "Fine mese, sono sempre al verde.", "Pod koniec miesiąca zawsze jestem spłukany."]
    - [essere in gamba, "być zdolnym, zaradnym", "Tua figlia è proprio in gamba!", "Twoja córka jest naprawdę zdolna!"]
    - [essere una buona forchetta, lubić dobrze zjeść, "Mio nonno è una buona forchetta.", "Mój dziadek lubi dobrze zjeść."]
    - [essere nelle nuvole, bujać w obłokach, "Oggi Marco è nelle nuvole.", "Marco buja dziś w obłokach."]
  phrases:
    - [c'è / ci sono, jest / są (znajduje się), "C'è un bar qui vicino?", "Czy jest tu w pobliżu bar?"]
    - [che ore sono?, która godzina?, "Scusi, che ore sono? — Sono le tre.", "Przepraszam, która godzina? — Trzecia."]
    - [com'è?, jaki/jaka jest?, "Com'è la tua nuova casa?", "Jaki jest twój nowy dom?"]
  related:
    - [l'essere, istota, "L'essere umano è curioso.", "Człowiek jest ciekawski."]
    - [l'esistenza, istnienie, "Una lunga esistenza tranquilla.", "Długie, spokojne życie."]
  synonyms:
    - {t: stare, n: być; czuć się, note: "Stare mówi o samopoczuciu i przebywaniu (sto bene, stai a casa?); essere — o tożsamości i cechach.", ex: ["Come stai? — Sto bene.", "Jak się masz? — Dobrze."]}
    - {t: trovarsi, n: znajdować się, note: "Bardziej oficjalne określenie położenia.", ex: ["Il museo si trova in centro.", "Muzeum znajduje się w centrum."]}
