verb: lavorare
n: pracować
emoji: "💼"
category: praca
regular: true
group: I koniugacja (-are), regularny
auxiliary: avere
transitive: "nieprzechodni (przechodni: lavorare il legno — obrabiać drewno)"
ipa: /la.voˈra.re/
stress: la-vo-RA-re (trzecia sylaba)
note: >-
  Odmienia się dokładnie jak parlare. „Gdzie” po lavorare: in banca, in ufficio, a casa, da casa (zdalnie),
  per una ditta (dla firmy), come cameriere (jako kelner).

