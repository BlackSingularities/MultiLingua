      - [avendo avuto, mając wcześniej / ponieważ miał, "Avendo avuto la febbre, è rimasto a casa.", "Ponieważ miał gorączkę, został w domu."]

extras:
  collocations:
    stany (zamiast polskiego „być”):
      - [avere fame, być głodnym, "Ho fame, mangiamo?", "Jestem głodny, jemy?"]
      - [avere sete, chcieć pić, "Hai sete? Ecco l'acqua.", "Chce ci się pić? Masz wodę."]
      - [avere freddo / caldo, być zimno / gorąco, "Ho freddo, chiudi la finestra.", "Zimno mi, zamknij okno."]
      - [avere sonno, być śpiącym, "Ha sonno, è tardi.", "Jest śpiący, jest późno."]
      - [avere paura, bać się, "Ho paura dei ragni.", "Boję się pająków."]
    z rzeczownikami:
      - [avere … anni, mieć … lat, "Quanti anni hai? — Ne ho venti.", "Ile masz lat? — Dwadzieścia."]
      - [avere ragione / torto, mieć rację / nie mieć racji, "Hai ragione, scusa.", "Masz rację, przepraszam."]
      - [avere bisogno di, potrzebować, "Ho bisogno di un caffè.", "Potrzebuję kawy."]
      - [avere voglia di, mieć ochotę na, "Hai voglia di un gelato?", "Masz ochotę na lody?"]
      - [avere fretta, spieszyć się, "Scusa, ho fretta!", "Przepraszam, spieszę się!"]
  idioms:
    - [avere le mani bucate, mieć dziurawe ręce (rozrzutność), "Con i soldi ha le mani bucate.", "Pieniądze przeciekają mu przez palce."]
    - [avere un diavolo per capello, być wściekłym, "Oggi il capo ha un diavolo per capello.", "Szef jest dziś wściekły."]
    - [avere la testa fra le nuvole, bujać w obłokach, "Hai sempre la testa fra le nuvole!", "Zawsze bujasz w obłokach!"]
    - [avercela con qualcuno, mieć do kogoś żal, "Ce l'hai con me?", "Masz do mnie żal?"]
  phrases:
    - [ce l'ho, mam (to), "Hai le chiavi? — Sì, ce l'ho.", "Masz klucze? — Tak, mam."]
    - [non ho idea, nie mam pojęcia, "Dov'è Luca? — Non ho idea.", "Gdzie jest Luca? — Nie mam pojęcia."]
    - [che cos'hai?, co ci jest?, "Che cos'hai? Sei pallido.", "Co ci jest? Jesteś blady."]
  related:
    - [gli averi, "majątek, dobytek", "Ha perso tutti i suoi averi.", "Stracił cały swój majątek."]
    - [l'avere, ma (w księgowości), "Il dare e l'avere.", "Winien i ma."]
  synonyms:
    - {t: possedere, n: posiadać, note: "Bardziej formalne; podkreśla własność.", ex: ["Possiede tre appartamenti.", "Posiada trzy mieszkania."]}
    - {t: tenere, n: trzymać; (na południu) mieć, note: "W standardowym włoskim „trzymać”; w mowie południowej zastępuje avere.", ex: ["Tieni la borsa, per favore.", "Potrzymaj torbę, proszę."]}
