    presente:
      - [abbi, miej, "Abbi pazienza!", "Miej cierpliwość!"]
      - [abbia, niech Pan/Pani ma, "Abbia pazienza, signora.", "Proszę o cierpliwość, pani."]
      - [abbiamo, miejmy, "Abbiamo fiducia!", "Miejmy zaufanie!"]
      - [abbiate, miejcie, "Abbiate coraggio!", "Miejcie odwagę!"]
      - [abbiano, niech mają, "Abbiano pazienza ancora un po'.", "Niech jeszcze trochę poczekają."]
