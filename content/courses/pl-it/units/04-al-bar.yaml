grammar:
  - id: it-verbi-are-ere
    title: Czasowniki regularne na -are i -ere
    summary: "Jeden wzór, setki czasowników: mangiare, prendere."
    body: |
      Czasowniki włoskie dzielą się na trzy grupy według końcówki bezokolicznika: **-are**, **-ere**, **-ire**. Dwie pierwsze odmieniają się bardzo podobnie:

      | osoba | -are: mangiare | -ere: prendere |
      |---|---|---|
      | io | mangi**o** | prend**o** |
      | tu | mang**i** | prend**i** |
      | lui / lei | mangi**a** | prend**e** |
      | noi | mang**iamo** | prend**iamo** |
      | voi | mangi**ate** | prend**ete** |
      | loro | mangi**ano** | prend**ono** |

      Różnią się tylko trzy formy: *lui/lei*, *voi* i *loro* (-a/-ate/-ano kontra -e/-ete/-ono).

      > Czasowniki na **-iare** (mangiare, studiare) nie podwajają *i*: tu **mangi** (nie „mangii”), noi **mangiamo** (nie „mangiiamo”).

      ### Bere — wyjątek
      **Bere** (pić) odmienia się od dawnego rdzenia *bev-*: bevo, bevi, beve, beviamo, bevete, bevono. Końcówki są regularne, zmienia się tylko rdzeń.

      ### Prendere = brać, ale też zamawiać
      W barze i restauracji *prendere* znaczy „wziąć, zamówić”: *Che cosa prendi?* — Co zamawiasz? *Prendo un panino.* — Wezmę kanapkę. Polskie „wezmę” (przyszły) po włosku wyrażamy czasem teraźniejszym.
    examples:
      - {t: "I bambini mangiano il gelato.", n: "Dzieci jedzą lody."}
      - {t: "Prendete un caffè?", n: "Napijecie się kawy?", note: "dosłownie: weźmiecie kawę?"}
      - {t: "Non bevo vino.", n: "Nie piję wina."}
    check:
      - {q: "Tu ___ la pizza? (mangiare)", options: [mangii, mangi, mangia], answer: 1}
      - {q: "Loro ___ un caffè. (prendere)", options: [prendano, prendono, prendete], answer: 1, explain: "-ere → loro -ono"}
      - {q: "Noi ___ acqua. (bere)", options: [beriamo, beviamo, bevamo], answer: 1}
      - {q: "Lei ___ il tè. (prendere)", options: [prenda, prende, prendi], answer: 1}

  - id: it-ordinare
    title: "Zamawianie: vorrei, per me, il conto"
    summary: Grzeczne zwroty i kilka zasad włoskiego baru.
    body: |
      Najprostszy sposób, by grzecznie zamówić: **vorrei** + to, czego chcesz. To tryb przypuszczający od *volere* (chcieć) — dosłownie „chciałbym/chciałabym”, ale używamy go jak polskiego „poproszę”.

      - *Vorrei un cappuccino, per favore.* — Poproszę cappuccino.
      - **Per me** un caffè, **per lei** un tè. — Dla mnie kawa, dla niej herbata.
      - *Posso avere il menù?* — Czy mogę prosić o menu?
      - **Il conto, per favore.** — Rachunek, proszę.
      - **Quanto costa?** / **Quanto costano?** — Ile kosztuje? / Ile kosztują?

      ### Jak to działa we włoskim barze
      - **Un caffè** to espresso. Kawa z mlekiem to *caffè latte* — samo „latte” to po prostu mleko!
      - Przy barze (*al banco*) jest taniej niż przy stoliku (*al tavolo*). Często najpierw płaci się przy kasie i dostaje paragon (*lo scontrino*), który pokazuje się barmanowi.
      - **Cappuccino** pije się do śniadania; po obiedzie zamówienie cappuccino zdradza turystę.

      > Na „Grazie!” kelner odpowie **Prego!**, a podając jedzenie powie **Ecco a lei** (proszę bardzo) i **Buon appetito!** (smacznego).
    examples:
      - {t: "Vorrei un'acqua, per favore.", n: "Poproszę wodę."}
      - {t: "Per me una pizza, per lui un panino.", n: "Dla mnie pizza, dla niego kanapka."}
      - {t: "Scusi, il conto, per favore.", n: "Przepraszam, rachunek proszę."}
    check:
      - {q: "Jak grzecznie zamówić kawę?", options: ["Voglio caffè!", "Vorrei un caffè, per favore.", "Prego un caffè."], answer: 1}
      - {q: "Zamawiasz „un caffè”. Co dostaniesz?", options: [kawę z mlekiem, espresso, mrożoną kawę], answer: 1}
      - {q: "Jak poprosić o rachunek?", options: ["Il conto, per favore.", "Il cameriere, per favore.", "Il costo, prego."], answer: 0}

  - id: it-aggettivi
    title: Przymiotniki — zgodność z rzeczownikiem
    summary: "Buono, buona, buoni, buone — i gdzie stawiać przymiotnik."
    body: |
      Przymiotnik zgadza się z rzeczownikiem w rodzaju i liczbie — tak jak w polskim. Są dwie grupy:

      | typ | m. lp | ż. lp | m. lm | ż. lm |
      |---|---|---|---|---|
      | na -o | fredd**o** | fredd**a** | fredd**i** | fredd**e** |
      | na -e | grand**e** | grand**e** | grand**i** | grand**i** |

      - *il caffè freddo, l'acqua fredda, i panini freddi, le birre fredde*
      - *il cane grande, la casa grande, i cani grandi, le case grandi*

      ### Gdzie stoi przymiotnik?
      Zwykle **po** rzeczowniku: *un vino rosso, una città italiana*. Kilka częstych przymiotników (buono, bello, grande, piccolo) stoi często **przed**: *una buona pizza, un piccolo bar*.

      > Przed rzeczownikiem *buono* skraca się jak rodzajnik: **un buon** caffè, **una buona** torta. „Buon appetito!” i „Buongiorno!” to właśnie ta forma.
    examples:
      - {t: "La pizza è buona e il vino è buono.", n: "Pizza jest dobra i wino jest dobre."}
      - {t: "Vorrei una birra fredda.", n: "Poproszę zimne piwo."}
      - {t: "I cornetti sono caldi.", n: "Rogaliki są ciepłe."}
    check:
      - {q: "L'acqua è ___.", options: [freddo, fredda, freddi], answer: 1}
      - {q: "I panini sono ___.", options: [buoni, buone, buona], answer: 0}
      - {q: "Le torte sono ___. (grande)", options: [grande, grandi, grando], answer: 1}

conjugations:
  - {verb: mangiare, n: jeść, tense: presente, label: czas teraźniejszy, forms: [mangio, mangi, mangia, mangiamo, mangiate, mangiano]}
  - {verb: prendere, n: brać, tense: presente, label: czas teraźniejszy, forms: [prendo, prendi, prende, prendiamo, prendete, prendono]}
  - {verb: bere, n: pić, tense: presente, label: czas teraźniejszy, forms: [bevo, bevi, beve, beviamo, bevete, bevono], irregular: true}

stories:
  - id: al-bar
    title: Al bar
    emoji: "☕"
    intro: Poniedziałkowy poranek. Marco i Anna wpadają na śniadanie do baru przy szkole.
    lines:
      - [Cameriere, "Buongiorno! Che cosa prendete?", "Dzień dobry! Co podać?"]
      - [Marco, "Per me un cappuccino e un cornetto, per favore.", "Dla mnie cappuccino i rogalik, proszę."]
      - [Cameriere, "E per la signorina?", "A dla pani?"]
      - [Anna, "Vorrei un tè caldo con il latte.", "Poproszę gorącą herbatę z mlekiem."]
      - [Cameriere, "Mi dispiace, il latte è finito. Va bene un tè al limone?", "Przykro mi, mleko się skończyło. Może być herbata z cytryną?"]
      - [Anna, "Va bene, grazie. E anche un panino.", "Dobrze, dziękuję. I jeszcze kanapkę."]
      - [Marco, "Anna, mangi un panino alle nove di mattina?", "Anna, jesz kanapkę o dziewiątej rano?"]
      - [Anna, "Sì! Ho molta fame.", "Tak! Jestem bardzo głodna."]
      - [Cameriere, "Ecco a voi. Buon appetito!", "Proszę bardzo. Smacznego!"]
      - [Marco, "Scusi, quanto costa tutto?", "Przepraszam, ile kosztuje wszystko?"]
      - [Cameriere, "Sono nove euro e cinquanta.", "Razem dziewięć euro pięćdziesiąt."]
      - [Marco, "Ecco dieci euro. Tenga il resto!", "Proszę, dziesięć euro. Reszty nie trzeba!"]
    questions:
      - {q: "Co zamawia Marco?", options: [kawę i kanapkę, cappuccino i rogalika, herbatę z cytryną], answer: 1}
      - {q: "Dlaczego Anna nie dostaje herbaty z mlekiem?", options: [mleko się skończyło, mleko jest zimne, kelner zapomniał], answer: 0}
      - {q: "Ile kosztuje wszystko?", options: ["9,50 €", "10 €", "5 €"], answer: 0}
      - {q: "Co mówi kelner, podając zamówienie?", options: ["Buon appetito!", "Il conto, per favore!", "Arrivederci!"], answer: 0}
