grammar:
  - id: it-genere
    title: Rodzaj i liczba rzeczowników
    summary: "Po końcówce poznasz, czy rzeczownik jest męski, czy żeński."
    body: |
      Włoski ma tylko **dwa rodzaje**: męski i żeński (nie ma nijakiego, jak w polskim). Rodzaj zwykle zdradza końcówka:

      | końcówka | rodzaj | przykład |
      |---|---|---|
      | **-o** | męski | *il ragazzo* — chłopak |
      | **-a** | żeński | *la ragazza* — dziewczyna |
      | **-e** | męski albo żeński | *il padre* — ojciec, *la notte* — noc |

      Rzeczowniki na **-e** trzeba zapamiętać razem z rodzajnikiem — dlatego w słowniku zawsze podajemy *il* albo *la*.

      ### Liczba mnoga
      Włoska liczba mnoga powstaje przez zmianę ostatniej samogłoski:

      | liczba pojedyncza | liczba mnoga |
      |---|---|
      | -o → **-i** | *ragazzo → ragazzi* |
      | -a → **-e** | *ragazza → ragazze* |
      | -e → **-i** | *studente → studenti*, *notte → notti* |

      Wyjątki, które warto znać od początku:
      - słowa z akcentem na końcu się nie zmieniają: *la città → le città*, *il caffè → i caffè*;
      - *l'uomo → gli uomini* (mężczyzna → mężczyźni);
      - słowa zapożyczone są nieodmienne: *il bar → i bar*, *lo sport → gli sport*.

      > Po polsku „Włoch” i „włoski” to dwa słowa. Po włosku **italiano** znaczy jedno i drugie — a także „po włosku”: *parlo italiano*.

      ### Narodowości
      Narodowości to przymiotniki i odmieniają się jak przymiotniki: *Marco è italiano, Anna è italiana*. Te na **-e** mają jedną formę dla obu rodzajów: *lui è inglese, lei è inglese*. Piszemy je **małą literą**.
    examples:
      - {t: "Il ragazzo è italiano.", n: "Chłopak jest Włochem."}
      - {t: "Le ragazze sono italiane.", n: "Dziewczyny są Włoszkami."}
      - {t: "Lei è francese.", n: "Ona jest Francuzką."}
      - {t: "Roma è una città, Milano e Napoli sono città.", n: "Rzym jest miastem, Mediolan i Neapol są miastami."}
    check:
      - {q: "Jaka jest liczba mnoga od „ragazza”?", options: [ragazzi, ragazze, ragazza], answer: 1}
      - {q: "Jaka jest liczba mnoga od „la città”?", options: [le citte, le città, le cittì], answer: 1, explain: "Słowa z akcentem na końcu się nie zmieniają."}
      - {q: "Anna è ___ (Polka).", options: [polacco, polacca, polacchi], answer: 1}
      - {q: "Które słowo jest rodzaju żeńskiego?", options: [ragazzo, donna, uomo], answer: 1}

  - id: it-articoli
    title: "Rodzajniki: un, uno, una — il, lo, la"
    summary: Jak wybrać rodzajnik w liczbie pojedynczej.
    body: |
      Polski nie ma rodzajników, więc to jedna z większych nowości. Rodzajnik stoi przed rzeczownikiem i zależy od jego **rodzaju** oraz od tego, **jak zaczyna się** następne słowo.

      ### Rodzajnik nieokreślony (jakiś, jeden)
      | | przed spółgłoską | przed s+spółgł., z, gn, ps | przed samogłoską |
      |---|---|---|---|
      | męski | **un** ragazzo | **uno** studente, **uno** zaino | **un** amico |
      | żeński | **una** ragazza | **una** studentessa | **un'**amica |

      ### Rodzajnik określony (ten konkretny)
      | | przed spółgłoską | przed s+spółgł., z, gn, ps | przed samogłoską |
      |---|---|---|---|
      | męski | **il** ragazzo | **lo** studente | **l'**amico |
      | żeński | **la** ragazza | **la** studentessa | **l'**amica |

      Kiedy który? Rodzajnika nieokreślonego używamy, gdy mówimy o czymś po raz pierwszy albo o jednym z wielu: *Paolo è un medico* (jednym z wielu lekarzy). Określonego — gdy wiadomo, o kogo chodzi: *il medico di Paolo* (konkretny lekarz Paola).

      > Przy zawodach po *essere* rodzajnik nieokreślony jest częsty, ale można go też pominąć: *Paolo è medico* i *Paolo è un medico* — oba zdania są poprawne.

      Apostrof pojawia się tylko w rodzaju żeńskim: **un'amica**, ale **un amico** (bez apostrofu!).
    examples:
      - {t: "Lui è uno studente.", n: "On jest studentem."}
      - {t: "Lei è un'insegnante.", n: "Ona jest nauczycielką."}
      - {t: "Lo studente parla inglese.", n: "Student mówi po angielsku."}
      - {t: "L'uomo e la donna sono amici.", n: "Mężczyzna i kobieta są przyjaciółmi."}
    check:
      - {q: "___ studente", options: [un, uno, una], answer: 1, explain: "s + spółgłoska → uno"}
      - {q: "___ amica", options: [un, una, "un'"], answer: 2, explain: "Rodzaj żeński przed samogłoską → un'"}
      - {q: "___ amico", options: ["un'", un, uno], answer: 1, explain: "Rodzaj męski przed samogłoską → un (bez apostrofu)"}
      - {q: "___ ragazza è spagnola.", options: [Il, Lo, La], answer: 2}

  - id: it-abitare-parlare
    title: "Skąd jesteś? — czasowniki na -are"
    summary: "Odmiana parlare i abitare oraz przyimki di, a, in."
    body: |
      Większość włoskich czasowników kończy się na **-are**. Odmieniają się według jednego wzoru: odcinamy *-are* i dodajemy końcówki. Wzorem są **parlare** (mówić) i **abitare** (mieszkać).

      | osoba | końcówka | parlare | abitare |
      |---|---|---|---|
      | io | -o | parl**o** | abit**o** |
      | tu | -i | parl**i** | abit**i** |
      | lui / lei | -a | parl**a** | abit**a** |
      | noi | -iamo | parl**iamo** | abit**iamo** |
      | voi | -ate | parl**ate** | abit**ate** |
      | loro | -ano | parl**ano** | abit**ano** |

      > W formie *loro* akcent pada na trzecią sylabę od końca: **à**bitano, **pàr**lano. Nie mów „abitàno”!

      ### Di, a, in — trzy małe przyimki
      - **di** + miasto = pochodzenie: *Sono di Napoli* — jestem z Neapolu. Pytanie: *Di dove sei?*
      - **a** + miasto = gdzie mieszkasz lub dokąd jedziesz: *Abito a Torino*.
      - **in** + kraj lub region: *Abito in Italia, in Toscana*.

      Po polsku w obu ostatnich przypadkach mówimy „w”, więc łatwo się pomylić. Zapamiętaj: **miasto → a, kraj → in**.
    examples:
      - {t: "Di dove sei? — Sono di Varsavia.", n: "Skąd jesteś? — Jestem z Warszawy."}
      - {t: "Abito a Roma, in Italia.", n: "Mieszkam w Rzymie, we Włoszech."}
      - {t: "Parliamo italiano e polacco.", n: "Mówimy po włosku i po polsku."}
    check:
      - {q: "Abito ___ Cracovia.", options: [in, a, di], answer: 1, explain: "Miasto → a"}
      - {q: "Loro ___ in Polonia.", options: [abitano, abitate, abitiamo], answer: 0}
      - {q: "Voi ___ inglese?", options: [parliamo, parlate, parlano], answer: 1}
      - {q: "Jak zapytać „Skąd jesteś?”", options: ["Dove abiti?", "Di dove sei?", "Chi sei?"], answer: 1}

conjugations:
  - {verb: parlare, n: mówić, tense: presente, label: czas teraźniejszy, forms: [parlo, parli, parla, parliamo, parlate, parlano]}
  - {verb: abitare, n: mieszkać, tense: presente, label: czas teraźniejszy, forms: [abito, abiti, abita, abitiamo, abitate, abitano]}

stories:
  - id: corso-di-lingua
    title: Al corso di lingua
    emoji: "🗺️"
    intro: Druga lekcja w szkole językowej. Nauczycielka prosi, żeby każdy się przedstawił.
    lines:
      - [Insegnante, "Allora, ragazzi, chi siete? Di dove siete?", "No to kim jesteście? Skąd jesteście?"]
      - [Hans, "Io sono Hans. Sono tedesco, di Berlino.", "Jestem Hans. Jestem Niemcem, z Berlina."]
      - [Insegnante, "Benvenuto, Hans! E tu?", "Witaj, Hans! A ty?"]
      - [Carmen, "Mi chiamo Carmen. Sono spagnola, ma abito a Firenze.", "Mam na imię Carmen. Jestem Hiszpanką, ale mieszkam we Florencji."]
      - [Insegnante, "Parli italiano, Carmen?", "Mówisz po włosku, Carmen?"]
      - [Carmen, "Sì, un po'. Parlo spagnolo, inglese e un po' di italiano.", "Tak, trochę. Mówię po hiszpańsku, po angielsku i trochę po włosku."]
      - [Insegnante, "Brava! E tu?", "Brawo! A ty?"]
      - [Anna, "Io sono Anna, sono polacca. Sono una studentessa.", "Jestem Anna, jestem Polką. Jestem studentką."]
      - [Hans, "Polacca? Di dove?", "Polką? Skąd?"]
      - [Anna, "Di Cracovia. È una città molto bella!", "Z Krakowa. To bardzo piękne miasto!"]
      - [Insegnante, "Perfetto. Siete un gruppo internazionale!", "Świetnie. Jesteście międzynarodową grupą!"]
    questions:
      - {q: "Skąd jest Hans?", options: [z Berlina, z Florencji, z Krakowa], answer: 0}
      - {q: "Gdzie mieszka Carmen?", options: [w Madrycie, we Florencji, w Rzymie], answer: 1, explain: "Abito a Firenze."}
      - {q: "Jakimi językami mówi Carmen?", options: ["tylko po hiszpańsku", "po hiszpańsku, angielsku i trochę po włosku", "po niemiecku i po włosku"], answer: 1}
      - {q: "Kim jest Anna?", options: [nauczycielką, studentką, lekarką], answer: 1}
