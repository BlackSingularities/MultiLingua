id: u02
title: Chi sei?
subtitle: Narodowości, pochodzenie i rodzajniki
cefr: A1
icon: "🌍"
goals:
  - Powiesz, skąd jesteś i gdzie mieszkasz
  - Rozpoznasz rodzaj rzeczownika po końcówce
  - Dobierzesz właściwy rodzajnik — un, uno, una, il, lo, la

