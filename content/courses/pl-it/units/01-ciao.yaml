id: u01
title: Ciao!
subtitle: Powitania i przedstawianie się
cefr: A1
icon: "👋"
goals:
  - Przywitasz się i pożegnasz o każdej porze dnia
  - Przedstawisz się i zapytasz o imię
  - Odmienisz czasowniki essere i stare

