grammar:
  - id: it-essere
    title: Zaimki osobowe i czasownik essere
    summary: "Ja, ty, on… i najważniejszy czasownik: być."
    body: |
      Czasownik **essere** (być) jest nieregularny — jego formy trzeba po prostu zapamiętać. To najczęściej używany czasownik w języku włoskim.

      | osoba | zaimek | essere | po polsku |
      |---|---|---|---|
      | 1. lp | io | **sono** | jestem |
      | 2. lp | tu | **sei** | jesteś |
      | 3. lp | lui / lei / Lei | **è** | jest |
      | 1. lm | noi | **siamo** | jesteśmy |
      | 2. lm | voi | **siete** | jesteście |
      | 3. lm | loro | **sono** | są |

      Tak jak w polskim, zaimek zwykle **pomijamy**, bo końcówka czasownika już mówi, o kogo chodzi: *Sono Marco* = Jestem Marco. Zaimek dodajemy dla podkreślenia albo kontrastu: *Io sono Marco, lui è Luca.*

      > Uważaj na **è** (jest) i **e** (i). Akcent zmienia znaczenie: *Marco è qui* — Marco jest tutaj; *Marco e Anna* — Marco i Anna.

      ### Forma grzecznościowa
      Do obcych i starszych osób zwracamy się w 3. osobie liczby pojedynczej, używając zaimka **Lei** (Pan / Pani) — dokładnie jak po polsku „Czy pan jest…?”. *Lei è italiano?* — Czy pan jest Włochem?

      ### Przeczenie
      Słówko **non** stawiamy przed czasownikiem: *Non sono Marco.* — Nie jestem Marco. Odpowiadając, często mówimy dwa razy „nie”: *No, non sono Marco.*

      Forma **sono** jest taka sama dla „ja jestem” i „oni są” — znaczenie wynika z kontekstu.
    examples:
      - {t: "Sono Anna, e tu?", n: "Jestem Anna, a ty?"}
      - {t: "Lei è molto gentile.", n: "Pani jest bardzo miła."}
      - {t: "Noi siamo amici.", n: "Jesteśmy przyjaciółmi."}
      - {t: "Marco non è qui.", n: "Marca tu nie ma.", note: "Dosłownie: Marco nie jest tutaj."}
    check:
      - {q: "Tu ___ Luca?", options: [sei, sono, è], answer: 0, explain: "tu → sei"}
      - {q: "Noi ___ amici.", options: [siete, siamo, sono], answer: 1, explain: "noi → siamo"}
      - {q: "Jak zapytać grzecznie nieznajomą osobę: „Czy pani jest Włoszką?”", options: ["Tu sei italiana?", "Lei è italiana?", "Voi siete italiana?"], answer: 1, explain: "Forma grzecznościowa to Lei + 3. osoba lp."}
      - {q: "Które zdanie znaczy „Marco i Anna”?", options: ["Marco è Anna", "Marco e Anna"], answer: 1, explain: "e bez akcentu to spójnik „i”."}

  - id: it-stare-saluti
    title: "Come stai? — stare i powitania"
    summary: Kiedy mówić buongiorno, a kiedy ciao, i jak zapytać o samopoczucie.
    body: |
      O samopoczucie pytamy czasownikiem **stare** (dosłownie: stać, przebywać), a nie *essere*:

      | osoba | stare |
      |---|---|
      | io | **sto** |
      | tu | **stai** |
      | lui / lei / Lei | **sta** |
      | noi | **stiamo** |
      | voi | **state** |
      | loro | **stanno** |

      - *Come stai?* — Jak się masz? (do kolegi)
      - *Come sta?* — Jak się pan/pani ma? (formalnie)
      - *Sto bene / molto bene / così così / male.* — Dobrze / bardzo dobrze / tak sobie / źle.

      ### Powitania według pory dnia
      - **Buongiorno** — rano i do wczesnego popołudnia.
      - **Buonasera** — od późnego popołudnia; we Włoszech wcześniej niż w Polsce, już około 16–17.
      - **Buonanotte** — tylko na dobranoc, przed snem.
      - **Ciao** — do znajomych, zarówno „cześć” na powitanie, jak i „pa” na pożegnanie.
      - **Arrivederci** — do widzenia (formalnie *ArrivederLa*).

      ### „Przepraszam” i „proszę”
      Po polsku „proszę” ma kilka znaczeń, po włosku — kilka słów:
      - **per favore** — gdy o coś prosisz: *Un caffè, per favore.*
      - **prego** — w odpowiedzi na „dziękuję” albo zapraszając: *Prego, entri!* (Proszę wejść!)
      - **scusa / scusi** — przepraszam (do kolegi / formalnie).

      > Przedstawiając się mówimy **mi chiamo…** (dosłownie: nazywam siebie). Pytanie: *Come ti chiami?* (nieformalnie) i *Come si chiama?* (formalnie).
    examples:
      - {t: "Buonasera, signora, come sta?", n: "Dobry wieczór pani, jak się pani miewa?"}
      - {t: "Sto molto bene, grazie.", n: "Mam się bardzo dobrze, dziękuję."}
      - {t: "Grazie! — Prego!", n: "Dziękuję! — Nie ma za co!"}
    check:
      - {q: "Jest 20:00, wchodzisz do restauracji. Co mówisz?", options: [Buongiorno, Buonasera, Buonanotte], answer: 1}
      - {q: "Ktoś mówi ci „grazie”. Odpowiadasz:", options: [Per favore, Prego, Scusa], answer: 1}
      - {q: "Come ___? — Sto bene.", options: [stai, sei, chiami], answer: 0, explain: "O samopoczucie pytamy czasownikiem stare."}

conjugations:
  - {verb: essere, n: być, tense: presente, label: czas teraźniejszy, forms: [sono, sei, è, siamo, siete, sono], irregular: true}
  - {verb: stare, n: mieć się, tense: presente, label: czas teraźniejszy, forms: [sto, stai, sta, stiamo, state, stanno], irregular: true}
  - {verb: chiamarsi, n: nazywać się, tense: presente, label: czas teraźniejszy, forms: [mi chiamo, ti chiami, si chiama, ci chiamiamo, vi chiamate, si chiamano], note: "Czasownik zwrotny — zaimek (mi, ti, si…) stoi przed czasownikiem."}

stories:
  - id: primo-giorno
    title: Il primo giorno
    emoji: "🏫"
    intro: Pierwszy dzień w szkole językowej we Florencji. Marco poznaje nową koleżankę z grupy.
    lines:
      - [Marco, "Ciao! Io sono Marco. E tu?", "Cześć! Jestem Marco. A ty?"]
      - [Anna, "Ciao, Marco! Mi chiamo Anna. Piacere!", "Cześć, Marco! Mam na imię Anna. Miło mi!"]
      - [Marco, "Piacere mio! Come stai?", "Mnie również! Jak się masz?"]
      - [Anna, "Sto bene, grazie. E tu?", "Dobrze, dziękuję. A ty?"]
      - [Marco, "Anch'io sto bene. Sei di Roma?", "Ja też dobrze. Jesteś z Rzymu?"]
      - [Anna, "No, non sono italiana. Sono di Cracovia!", "Nie, nie jestem Włoszką. Jestem z Krakowa!"]
      - [Marco, "Davvero? Che bello!", "Naprawdę? Jak fajnie!"]
      - [Signora Bianchi, "Buongiorno, ragazzi!", "Dzień dobry, kochani!"]
      - [Anna, "Buongiorno, signora!", "Dzień dobry pani!"]
      - [Signora Bianchi, "Io sono la vostra insegnante. Come state?", "Jestem waszą nauczycielką. Jak się macie?"]
      - [Marco, "Molto bene, grazie!", "Bardzo dobrze, dziękujemy!"]
      - [Signora Bianchi, "Benissimo! Allora, cominciamo!", "Świetnie! No to zaczynamy!"]
    questions:
      - {q: "Jak ma na imię dziewczyna?", options: [Giulia, Anna, Maria], answer: 1}
      - {q: "Skąd jest Anna?", options: [z Rzymu, z Krakowa, z Florencji], answer: 1, explain: "Sono di Cracovia — jestem z Krakowa."}
      - {q: "Jak się ma Marco?", options: [dobrze, źle, tak sobie], answer: 0, explain: "Anch'io sto bene."}
      - {q: "Kim jest signora Bianchi?", options: [mamą Marca, nauczycielką, kelnerką], answer: 1, explain: "Io sono la vostra insegnante."}
