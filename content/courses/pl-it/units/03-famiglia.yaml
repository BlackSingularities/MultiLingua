id: u03
title: La famiglia
subtitle: Rodzina, wiek i czasownik avere
cefr: A1
icon: "👨‍👩‍👧"
goals:
  - Przedstawisz swoją rodzinę
  - Powiesz, ile masz lat, i zapytasz o wiek
  - Użyjesz rodzajników w liczbie mnogiej i zaimków mio, tuo, suo

