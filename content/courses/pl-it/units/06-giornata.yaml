id: u06
title: La giornata
subtitle: Godziny, dni tygodnia i codzienne czynności
cefr: A1
icon: "⏰"
goals:
  - Powiesz, która jest godzina, i umówisz się na konkretną porę
  - Opowiesz o swoim zwykłym dniu
  - Odmienisz czasowniki zwrotne i czasowniki na -ire

