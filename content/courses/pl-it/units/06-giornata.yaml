grammar:
  - id: it-ore
    title: "Która godzina? — Che ore sono?"
    summary: "Sono le otto, è l'una, alle sette — godziny po włosku."
    body: |
      Pytamy **Che ore sono?** albo **Che ora è?** (obie formy są poprawne). Odpowiedź zawiera rodzajnik żeński, bo w domyśle jest słowo *le ore* (godziny):

      | godzina | po włosku |
      |---|---|
      | 1:00 | **È l'una** |
      | 2:00 | **Sono le due** |
      | 8:00 | **Sono le otto** |
      | 12:00 | **È mezzogiorno** |
      | 24:00 | **È mezzanotte** |

      Uwaga na liczbę: *È l'una* (jedna godzina → liczba pojedyncza), ale *Sono le due, le tre…* (mnoga).

      ### Minuty
      - **e un quarto** — kwadrans po: *sono le tre e un quarto* (3:15)
      - **e mezza** — wpół do… (po!): *sono le dieci e mezza* (10:30)
      - **meno un quarto** — za kwadrans: *sono le sei meno un quarto* (5:45)
      - **e dieci, e venti…** — *sono le nove e venti* (9:20)

      > Uwaga, pułapka: polskie „wpół do jedenastej” to 10:30, a po włosku liczymy od pełnej godziny w przód: **le dieci e mezza**.

      ### O której?
      **A che ora…?** — O której? Odpowiedź z przyimkiem ściągniętym: **alle** otto, **all'**una, **a** mezzogiorno. *Mi alzo alle sette.*
    examples:
      - {t: "Che ore sono? — Sono le quattro e un quarto.", n: "Która godzina? — Jest kwadrans po czwartej."}
      - {t: "A che ora parte il treno? — All'una.", n: "O której odjeżdża pociąg? — O pierwszej."}
      - {t: "La lezione finisce a mezzogiorno.", n: "Lekcja kończy się w południe."}
    check:
      - {q: "1:00 to:", options: ["Sono le una.", "È l'una.", "È una."], answer: 1}
      - {q: "10:30 to:", options: ["Sono le dieci e mezza.", "Sono le undici e mezza.", "È mezza dieci."], answer: 0}
      - {q: "Mi alzo ___ sette.", options: [le, alle, a], answer: 1}

  - id: it-riflessivi
    title: "Czasowniki zwrotne: alzarsi, svegliarsi"
    summary: "Mi alzo, ti alzi, si alza — „się” po włosku zmienia się z osobą."
    body: |
      Czasowniki zwrotne mają w bezokoliczniku końcówkę **-si**: *alzarsi* (wstawać), *svegliarsi* (budzić się), *lavarsi* (myć się), *vestirsi* (ubierać się), *chiamarsi* (nazywać się).

      W polskim „się” jest jedno dla wszystkich osób. We włoskim zaimek zwrotny zmienia się z osobą i stoi **przed** czasownikiem:

      | osoba | zaimek | alzarsi | po polsku |
      |---|---|---|---|
      | io | **mi** | mi alzo | wstaję |
      | tu | **ti** | ti alzi | wstajesz |
      | lui / lei | **si** | si alza | wstaje |
      | noi | **ci** | ci alziamo | wstajemy |
      | voi | **vi** | vi alzate | wstajecie |
      | loro | **si** | si alzano | wstają |

      Sam czasownik odmienia się regularnie (tu: jak *-are*). Przeczenie stoi przed zaimkiem: **non mi** alzo presto.

      > Nie wszystkie zwrotne czasowniki włoskie są zwrotne po polsku: *alzarsi* to „wstawać” (bez „się”), a *vestirsi* to „ubierać się”. Trzeba je zapamiętywać razem z *-si*.
    examples:
      - {t: "Mi sveglio alle sette e mi alzo alle sette e un quarto.", n: "Budzę się o siódmej i wstaję kwadrans po siódmej."}
      - {t: "Marco si lava e si veste.", n: "Marco myje się i ubiera."}
      - {t: "Non ci alziamo mai presto.", n: "Nigdy nie wstajemy wcześnie."}
    check:
      - {q: "Noi ___ alziamo alle otto.", options: [si, ci, vi], answer: 1}
      - {q: "Loro ___ svegliano tardi.", options: [si, vi, ci], answer: 0}
      - {q: "Jak powiesz „Nie wstaję wcześnie”?", options: ["Mi non alzo presto.", "Non mi alzo presto.", "Non alzo mi presto."], answer: 1}

  - id: it-verbi-ire
    title: "Czasowniki na -ire: dormire i finire"
    summary: "Dwa wzory odmiany — jeden z dodatkiem -isc-."
    body: |
      Trzecia grupa czasowników kończy się na **-ire** i ma dwa wzory. Część odmienia się jak **dormire** (spać), a część — jak **finire** (kończyć), z dodatkowym **-isc-** w czterech osobach:

      | osoba | dormire | finire |
      |---|---|---|
      | io | dorm**o** | fin**isco** |
      | tu | dorm**i** | fin**isci** |
      | lui / lei | dorm**e** | fin**isce** |
      | noi | dorm**iamo** | fin**iamo** |
      | voi | dorm**ite** | fin**ite** |
      | loro | dorm**ono** | fin**iscono** |

      Jak *dormire*: **partire** (wyjeżdżać), *aprire* (otwierać), *sentire* (czuć, słyszeć), *vestirsi*.
      Jak *finire*: *capire* (rozumieć), *preferire* (woleć), *pulire* (sprzątać).

      > Formy *noi* i *voi* nigdy nie mają -isc-: *finiamo, finite*. A *-isco* czytamy „isko”, *-isci* i *-isce* — „iszi”, „isze”.
    examples:
      - {t: "I bambini dormono.", n: "Dzieci śpią."}
      - {t: "Finisco di lavorare alle cinque.", n: "Kończę pracę o piątej."}
      - {t: "Non capisco.", n: "Nie rozumiem."}
    check:
      - {q: "Io ___ alle sei. (finire)", options: [fino, finisco, finiscio], answer: 1}
      - {q: "Noi ___ domani. (partire)", options: [partiamo, partisciamo, partono], answer: 0}
      - {q: "Voi ___ presto? (finire)", options: [finiscete, finite, finete], answer: 1}

  - id: it-giorni
    title: Dni tygodnia
    summary: "Lunedì czy il lunedì? Mała różnica, duża zmiana znaczenia."
    body: |
      Dni tygodnia piszemy **małą literą**. Prawie wszystkie są rodzaju męskiego — wyjątkiem jest **la domenica**.

      | po polsku | po włosku |
      |---|---|
      | poniedziałek | lunedì |
      | wtorek | martedì |
      | środa | mercoledì |
      | czwartek | giovedì |
      | piątek | venerdì |
      | sobota | sabato |
      | niedziela | domenica |

      ### Z rodzajnikiem czy bez?
      - **Lunedì** vado a Roma. — W (ten najbliższy) poniedziałek jadę do Rzymu.
      - **Il lunedì** vado in palestra. — W poniedziałki (co tydzień) chodzę na siłownię.

      Rodzajnik zmienia „w ten poniedziałek” na „w każdy poniedziałek”. Po polsku podobnie zmieniamy „w poniedziałek” na „w poniedziałki”.

      > Od–do: **dal** lunedì **al** venerdì — od poniedziałku do piątku. Pory dnia: **la** mattina (rano), **il** pomeriggio (po południu), **la** sera (wieczorem), **di** notte (w nocy).
    examples:
      - {t: "Oggi è giovedì.", n: "Dziś jest czwartek."}
      - {t: "La domenica dormo fino a tardi.", n: "W niedziele śpię do późna."}
      - {t: "Lavoro dal lunedì al venerdì.", n: "Pracuję od poniedziałku do piątku."}
    check:
      - {q: "„W soboty gram w piłkę” — jak zacząć zdanie?", options: ["Sabato…", "Il sabato…", "La sabato…"], answer: 1}
      - {q: "Który dzień jest rodzaju żeńskiego?", options: [sabato, domenica, venerdì], answer: 1}
      - {q: "Od poniedziałku do piątku:", options: ["da lunedì a venerdì", "dal lunedì al venerdì", "del lunedì nel venerdì"], answer: 1}

conjugations:
  - {verb: alzarsi, n: wstawać, tense: presente, label: czas teraźniejszy, forms: [mi alzo, ti alzi, si alza, ci alziamo, vi alzate, si alzano], note: "Zaimek zwrotny stoi przed czasownikiem."}
  - {verb: dormire, n: spać, tense: presente, label: czas teraźniejszy, forms: [dormo, dormi, dorme, dormiamo, dormite, dormono]}
  - {verb: finire, n: kończyć, tense: presente, label: czas teraźniejszy, forms: [finisco, finisci, finisce, finiamo, finite, finiscono], note: "Wzór z -isc- (jak capire, preferire)."}

stories:
  - id: giornata-luca
    title: Una mattina di Luca
    emoji: "⏰"
    intro: Siódma trzydzieści. Mama budzi Lukę, który jest pewien, że dziś sobota.
    lines:
      - [Mamma, "Luca! Sono le sette e mezza! Ti alzi o no?", "Luca! Jest wpół do ósmej! Wstajesz czy nie?"]
      - [Luca, "Mamma, oggi è sabato… Dormo ancora un po'.", "Mamo, dzisiaj jest sobota… Pośpię jeszcze trochę."]
      - [Mamma, "No, oggi è venerdì! Hai lezione alle nove.", "Nie, dzisiaj jest piątek! Masz lekcję o dziewiątej."]
      - [Luca, "Venerdì?! Mi alzo, mi alzo!", "Piątek?! Wstaję, wstaję!"]
      - [Luca, "Mi lavo, mi vesto e… dov'è il mio zaino?", "Myję się, ubieram i… gdzie jest mój plecak?"]
      - [Mamma, "È in cucina, sulla sedia.", "Jest w kuchni, na krześle."]
      - [Luca, "Grazie, mamma! A che ora finisce la lezione oggi?", "Dzięki, mamo! O której dziś kończy się lekcja?"]
      - [Mamma, "Finisci all'una. Il pomeriggio studi a casa.", "Kończysz o pierwszej. Po południu uczysz się w domu."]
      - [Luca, "E la sera?", "A wieczorem?"]
      - [Mamma, "La sera dormi presto. Domani è sabato!", "Wieczorem kładziesz się wcześnie. Jutro jest sobota!"]
    questions:
      - {q: "Jaki dzień jest naprawdę?", options: [sobota, piątek, poniedziałek], answer: 1, explain: "Oggi è venerdì."}
      - {q: "O której Luca ma lekcję?", options: ["o 7:30", "o 9:00", "o 13:00"], answer: 1, explain: "Hai lezione alle nove."}
      - {q: "Gdzie jest plecak?", options: [w kuchni na krześle, w łazience, w samochodzie], answer: 0, explain: "È in cucina, sulla sedia."}
      - {q: "Co Luca robi po południu?", options: [śpi, uczy się w domu, je obiad u dziadków], answer: 1, explain: "Il pomeriggio studi a casa."}
