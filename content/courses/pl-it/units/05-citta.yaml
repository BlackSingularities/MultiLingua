grammar:
  - id: it-ce-ci-sono
    title: "C'è i ci sono — jest, są"
    summary: "Kiedy mówić c'è, a kiedy po prostu è."
    body: |
      Polskie „jest” w znaczeniu „istnieje, znajduje się” to po włosku **c'è** (liczba pojedyncza) i **ci sono** (mnoga):

      - **C'è** una farmacia qui vicino? — Czy jest tu w pobliżu apteka?
      - In centro **ci sono** molti negozi. — W centrum jest dużo sklepów.

      Po polsku przy liczbie mnogiej też często mówimy „jest” („jest dużo sklepów”), po włosku musi być **ci sono**.

      ### C'è czy è?
      | pytanie | znaczenie | przykład |
      |---|---|---|
      | **C'è** …? | czy coś w ogóle tu jest? | *C'è una banca?* — Jest tu (jakiś) bank? |
      | **Dov'è** …? | gdzie jest ta konkretna rzecz? | *Dov'è la banca?* — Gdzie jest bank? |

      Zauważ rodzajnik: po *c'è* zwykle stoi **nieokreślony** (*una* farmacia — jakaś), po *dov'è* — **określony** (*la* stazione — ta, którą znamy).

      > Przeczenie: **non c'è** — nie ma (czegoś). *Non c'è il bagno in camera* — w pokoju nie ma łazienki. Po polsku zmienia się przypadek („łazienki”), po włosku nic.
    examples:
      - {t: "C'è un bar qui vicino?", n: "Jest tu w pobliżu jakiś bar?"}
      - {t: "Ci sono due bagni.", n: "Są dwie łazienki."}
      - {t: "Dov'è il bar Roma?", n: "Gdzie jest bar Roma?"}
      - {t: "Marco non c'è.", n: "Marca nie ma."}
    check:
      - {q: "In piazza ___ tre bar.", options: ["c'è", ci sono, è], answer: 1}
      - {q: "___ un supermercato qui vicino?", options: ["C'è", Ci sono, Sono], answer: 0}
      - {q: "Szukasz konkretnego muzeum w mieście. Pytasz:", options: ["C'è il museo?", "Dov'è il museo?", "Ci sono musei?"], answer: 1, explain: "Konkretne, znane miejsce: dov'è…? Pytanie c'è…? zadajemy, gdy nie wiemy, czy coś w ogóle jest."}

  - id: it-preposizioni-articolate
    title: "Przyimki ściągnięte: nel, sul, al, del…"
    summary: "W + ten = nel. Jak przyimek łączy się z rodzajnikiem."
    body: |
      Pięć częstych przyimków **łączy się z rodzajnikiem określonym** w jedno słowo. Brzmi to skomplikowanie, ale wzór jest regularny:

      | | il | lo | l' | la | i | gli | le |
      |---|---|---|---|---|---|---|---|
      | **a** (do, w) | al | allo | all' | alla | ai | agli | alle |
      | **di** (z, -ego) | del | dello | dell' | della | dei | degli | delle |
      | **da** (od, u) | dal | dallo | dall' | dalla | dai | dagli | dalle |
      | **in** (w) | nel | nello | nell' | nella | nei | negli | nelle |
      | **su** (na) | sul | sullo | sull' | sulla | sui | sugli | sulle |

      - Il gatto è **sul** letto (su + il). — Kot jest na łóżku.
      - Siamo **nel** parco (in + il). — Jesteśmy w parku.
      - È vicino **alla** stazione (a + la). — Jest blisko dworca.

      Przyimki **con** (z), **per** (dla), **tra/fra** (między) się nie łączą: *con il latte*, *per la mamma*.

      > Bez rodzajnika nie ma ściągania: *in Italia, a Roma, in piazza, in centro* — to stałe wyrażenia bez rodzajnika.
    examples:
      - {t: "Il gatto è sul tavolo.", n: "Kot jest na stole."}
      - {t: "Abito vicino al parco.", n: "Mieszkam blisko parku."}
      - {t: "La farmacia è nella piazza grande.", n: "Apteka jest na dużym placu."}
    check:
      - {q: "Il gatto è ___ letto. (su + il)", options: [sul, sullo, nel], answer: 0}
      - {q: "Lavoro ___ ospedale. (in + l')", options: [nello, "nell'", nel], answer: 1}
      - {q: "Vicino ___ stazione (a + la)", options: [al, alla, alle], answer: 1}
      - {q: "Siamo ___ parco. (in + il)", options: [nel, nello, nella], answer: 0}

  - id: it-direzioni
    title: "Pytanie o drogę"
    summary: "Destra, sinistra, dritto — i forma grzecznościowa w praktyce."
    body: |
      Pytając obcą osobę o drogę, używamy formy **Lei** — czyli zaczynamy od **Scusi** (przepraszam pana/panią), nie *Scusa*:

      - **Scusi, dov'è** la stazione? — Przepraszam, gdzie jest dworzec?
      - **Scusi, c'è** una farmacia qui vicino?
      - **È lontano?** — Czy to daleko?

      ### Wskazówki
      - **sempre dritto** — cały czas prosto
      - **a destra / a sinistra** — w prawo / w lewo
      - **poi** — potem; **dopo** il parco — za parkiem
      - **vicino a** — blisko; **lontano da** — daleko od
      - **accanto a** — obok; **di fronte a** — naprzeciwko

      ### Bello — jak rodzajnik
      Przymiotnik **bello** przed rzeczownikiem przybiera formy podobne do rodzajnika: **bel** ragazzo (il), **bello** studente (lo), **bell'**albergo (l'), **bella** piazza, **bei** negozi (i), **begli** alberghi (gli), **belle** case. Po rzeczowniku jest regularny: *la piazza è bella*.

      > Odpowiadający często powie *Vada…* (Niech pan idzie…), *Giri a destra* (Proszę skręcić w prawo) — to tryb rozkazujący w formie grzecznościowej. Wystarczy go rozumieć.
    examples:
      - {t: "Scusi, è lontano il museo?", n: "Przepraszam, czy muzeum jest daleko?"}
      - {t: "Vada sempre dritto e poi giri a sinistra.", n: "Proszę iść cały czas prosto, a potem skręcić w lewo."}
      - {t: "Che bel parco!", n: "Jaki piękny park!"}
    check:
      - {q: "Pytasz nieznajomego o drogę. Zaczynasz od:", options: ["Scusa", "Scusi", "Ciao"], answer: 1}
      - {q: "„Na lewo” to:", options: [a destra, a sinistra, dritto], answer: 1}
      - {q: "Che ___ piazza!", options: [bel, bello, bella], answer: 2}

