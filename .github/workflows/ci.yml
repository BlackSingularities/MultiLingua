name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multilingua-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Content database
        run: npm run content
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Web build
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact tested commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/multilingua_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/multilingua_deploy ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/multilingua_deploy' EXIT
          git archive --format=tar.gz "$GITHUB_SHA" \
            | ssh -i ~/.ssh/multilingua_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 \
                "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error https://redzikowski.com/multilingua/api/health
          curl --fail --silent --show-error https://redzikowski.com/multilingua/ -o /dev/null
          curl --fail --silent --show-error https://redzikowski.com/multilingua/api/courses -o /dev/null
