name: multilingua
services:
  multilingua:
    image: multilingua:${DEPLOY_SHA:-latest}
    container_name: multilingua
    restart: unless-stopped
    init: true
    environment:
      GITHUB_REPO: BlackSingularities/MultiLingua
    networks:
      - webproxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  webproxy:
    external: true
